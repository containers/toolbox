- name: Install RPM packages from CentOS Stream
  become: yes
  package:
    name:
      - flatpak-session-helper
      - gcc
      - golang
      - httpd-tools
      - meson
      - ninja-build
      - openssl
      - pkgconfig(bash-completion)
      - podman
      - shadow-utils-subid-devel
      - skopeo
      - systemd
      - udisks2

- name: Install RPM packages from CentOS Stream CodeReady Linux Builder
  become: yes
  package:
    enablerepo: crb
    name:
      - golang-github-cpuguy83-md2man

- name: Enable EPEL
  become: yes
  package:
    name:
      - epel-release

- name: Install RPM packages from EPEL
  become: yes
  package:
    name:
      - ShellCheck
      - bats
      - codespell
      - fish

- name: Ensure that 'p11-kit server' is absent
  become: yes
  package:
    name:
      - p11-kit-server
    state: absent

- include_tasks: dependencies-common.yaml
